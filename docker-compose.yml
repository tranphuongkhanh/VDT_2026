services:
  # Database Service
  db:
    image: postgres:15-alpine
    container_name: vdt_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: vdt_2026
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: XuhaoBapcai@24042105
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount sql schema initialization script to run on database start
      - ./backend/database/vdt_2026_db.sql:/docker-entrypoint-initdb.d/init.sql

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: vdt_minio
    restart: unless-stopped
    ports:
      - "9000:9000" # API Port
      - "9001:9001" # Web Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  # Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vdt_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:postgresql://vdt_postgres:5432/vdt_2026
      - DB_USERNAME=postgres
      - DB_PASSWORD=XuhaoBapcai@24042105
      - JWT_SECRET=dGhpc2lzYWJlYXV0aWZ1bHNlY3JldGtleWZvcmp3dHRva2VuZ2VuZXJhdGlvbnZkdDIwMjY=
      - MINIO_URL=http://vdt_minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=vdt-2026
    depends_on:
      - db
      - minio

  # React Frontend (served via Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Pass backend endpoint url at build-time for SPA static site compilation
        - VITE_API_BASE_URL=http://localhost:8080
    container_name: vdt_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: vdt_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend

  # Grafana Dashboard Visualizer
  grafana:
    image: grafana/grafana:latest
    container_name: vdt_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

volumes:
  minio_data:
  postgres_data: