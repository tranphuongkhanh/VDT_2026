spring:
  application:
    name: backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 900000 # 15 minutes (15 * 60 * 1000)
    refresh-expiration-ms: 604800000 # 7 days (7 * 24 * 60 * 60 * 1000)
